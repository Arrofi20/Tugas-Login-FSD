<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_15%_20%,rgba(56,189,248,0.2),transparent_30%),radial-gradient(circle_at_85%_30%,rgba(168,85,247,0.2),transparent_35%),radial-gradient(circle_at_50%_90%,rgba(59,130,246,0.2),transparent_35%)]"></div>
    <main class="min-h-screen flex items-center justify-center p-4">
      <section class="w-full max-w-md rounded-2xl border border-white/10 bg-white/5 p-6 backdrop-blur-xl shadow-2xl shadow-black/30">
        <div class="mb-6 text-center">
          <p class="text-xs uppercase tracking-[0.2em] text-cyan-300/80">Supabase Auth</p>
          <h1 id="form-title" class="mt-2 text-2xl font-bold">Login Akun</h1>
          <p class="mt-2 text-sm text-slate-300">Masuk atau daftar dengan email dan password.</p>
        </div>

        <div class="mb-5 grid grid-cols-2 gap-2 rounded-xl bg-slate-900/70 p-1">
          <button
            id="mode-login"
            type="button"
            class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white transition"
          >
            Login
          </button>
          <button
            id="mode-register"
            type="button"
            class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-300 transition hover:bg-slate-800"
          >
            Register
          </button>
        </div>

        <form id="auth-form" class="space-y-4">
          <div>
            <label for="email" class="mb-1 block text-sm font-medium text-slate-200">Email</label>
            <input
              id="email"
              type="email"
              placeholder="nama@email.com"
              class="w-full rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label for="password" class="mb-1 block text-sm font-medium text-slate-200">Password</label>
            <input
              id="password"
              type="password"
              placeholder="Masukkan password"
              class="w-full rounded-lg border border-white/10 bg-slate-900/60 px-3 py-2 text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <button
            id="submit-btn"
            type="submit"
            class="w-full rounded-lg bg-gradient-to-r from-indigo-500 to-violet-500 py-2 font-semibold text-white transition hover:brightness-110"
          >
            Login
          </button>
        </form>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
